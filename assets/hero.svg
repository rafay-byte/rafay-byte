<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="250" fill="none">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131a"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="35%" stop-color="#bc8cff"/>
      <stop offset="70%" stop-color="#39c5bb"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: #58a6ff; }
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <!-- Shell Container -->
  <rect x="2" y="2" width="876" height="246" rx="12" fill="url(#hero-bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="3.5" rx="2" fill="url(#hero-accent)"/>

  <!-- Titlebar -->
  <rect x="2" y="5" width="876" height="36" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  
  <!-- Window Dots -->
  <circle cx="24" cy="23" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="23" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="23" r="5.5" fill="#27c93f"/>

  <!-- Window Header -->
  <text x="440" y="27" fill="#8b949e" class="mono" font-size="12" font-weight="600" text-anchor="middle">rafay-byte // ai-lab &bull; zsh</text>

  <!-- Online Status Pill -->
  <g transform="translate(734, 14)">
    <rect width="126" height="20" rx="10" fill="#238636" fill-opacity="0.15" stroke="#238636" stroke-width="0.8"/>
    <circle cx="12" cy="10" r="3.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="14" fill="#3fb950" class="mono" font-size="10" font-weight="700">STATUS: ONLINE</text>
  </g>

  <!-- Hero Content Area -->
  <!-- Top: Terminal Prompt & Initialization -->
  <g transform="translate(32, 60)">
    <text x="0" y="16" fill="#58a6ff" class="mono" font-size="13" font-weight="700">$</text>
    <text x="18" y="16" fill="#c9d1d9" class="mono" font-size="13">rafay-byte --init --role="AI/ML Engineer"</text>
    <rect x="358" y="4" width="7.5" height="15" class="cursor"/>

    <!-- Subtle Live Line -->
    <text x="0" y="42" fill="#8b949e" class="mono" font-size="12.5">&gt; System initialized. Researching autonomous multi-agent architectures &amp; vision systems.</text>
  </g>

  <!-- Subtle Divider -->
  <line x1="32" y1="126" x2="848" y2="126" stroke="#21262d" stroke-width="1"/>

  <!-- Bottom: Name & Specializations Banner -->
  <g transform="translate(32, 144)">
    <!-- Identity -->
    <text x="0" y="32" fill="#ffffff" class="sans" font-size="28" font-weight="800" letter-spacing="0.5">ABDUL RAFAY KHALID</text>
    <text x="0" y="58" fill="#58a6ff" class="mono" font-size="12.5" font-weight="700" letter-spacing="1">AI / ML ENGINEER &bull; AUTONOMOUS SYSTEMS &amp; VISION</text>

    <!-- Specializations Badge Block -->
    <g transform="translate(480, 8)">
      <rect width="336" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="22" fill="#8b949e" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.5">CORE FOCUS DOMAINS:</text>
      <text x="16" y="40" fill="#39c5bb" class="mono" font-size="11.5" font-weight="700">LLMs &bull; CV &bull; GENAI &bull; AGENTS</text>
    </g>
  </g>
</svg>
