<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" height="130" fill="none">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131a"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="arch-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="node-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <style>
    .flow-line { stroke-dasharray: 6, 4; animation: flow 1.2s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="126" rx="12" fill="url(#arch-bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="3" rx="1.5" fill="url(#arch-glow)"/>

  <!-- Top Header Label -->
  <text x="32" y="26" fill="#8b949e" class="mono" font-size="11" font-weight="700" letter-spacing="1">// SYSTEM ARCHITECTURE // END-TO-END PIPELINE</text>

  <!-- Node 1: DATA -->
  <g transform="translate(32, 38)">
    <rect width="170" height="72" rx="8" fill="url(#node-bg)" stroke="#1f6feb" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="3" rx="1.5" fill="#58a6ff"/>
    <circle cx="16" cy="18" r="3.5" fill="#58a6ff"/>
    <text x="26" y="22" fill="#58a6ff" class="mono" font-size="12" font-weight="700">01. DATA</text>
    <text x="14" y="44" fill="#c9d1d9" class="sans" font-size="12" font-weight="600">Ingestion Feeds</text>
    <text x="14" y="59" fill="#8b949e" class="mono" font-size="10.5">Options • Video • Text</text>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(202, 74)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#58a6ff" stroke-width="2" class="flow-line"/>
    <polygon points="38,-4 44,0 38,4" fill="#58a6ff"/>
  </g>

  <!-- Node 2: MODELS -->
  <g transform="translate(246, 38)">
    <rect width="170" height="72" rx="8" fill="url(#node-bg)" stroke="#8957e5" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="3" rx="1.5" fill="#bc8cff"/>
    <circle cx="16" cy="18" r="3.5" fill="#bc8cff"/>
    <text x="26" y="22" fill="#bc8cff" class="mono" font-size="12" font-weight="700">02. MODELS</text>
    <text x="14" y="44" fill="#c9d1d9" class="sans" font-size="12" font-weight="600">Neural Engines</text>
    <text x="14" y="59" fill="#8b949e" class="mono" font-size="10.5">LLMs • YOLO • Diffusion</text>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(416, 74)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#bc8cff" stroke-width="2" class="flow-line"/>
    <polygon points="38,-4 44,0 38,4" fill="#bc8cff"/>
  </g>

  <!-- Node 3: INTELLIGENCE -->
  <g transform="translate(460, 38)">
    <rect width="170" height="72" rx="8" fill="url(#node-bg)" stroke="#1b7c83" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="3" rx="1.5" fill="#39c5bb"/>
    <circle cx="16" cy="18" r="3.5" fill="#39c5bb"/>
    <text x="26" y="22" fill="#39c5bb" class="mono" font-size="12" font-weight="700">03. INTELLIGENCE</text>
    <text x="14" y="44" fill="#c9d1d9" class="sans" font-size="12" font-weight="600">Reasoning &amp; Fusion</text>
    <text x="14" y="59" fill="#8b949e" class="mono" font-size="10.5">Multi-Agent • ControlNet</text>
  </g>

  <!-- Connector 3 -->
  <g transform="translate(630, 74)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#3fb950" stroke-width="2" class="flow-line"/>
    <polygon points="38,-4 44,0 38,4" fill="#3fb950"/>
  </g>

  <!-- Node 4: AI SYSTEMS -->
  <g transform="translate(674, 38)">
    <rect width="174" height="72" rx="8" fill="url(#node-bg)" stroke="#238636" stroke-width="1.2"/>
    <rect x="0" y="0" width="174" height="3" rx="1.5" fill="#3fb950"/>
    <circle cx="16" cy="18" r="3.5" fill="#3fb950"/>
    <text x="26" y="22" fill="#3fb950" class="mono" font-size="12" font-weight="700">04. AI SYSTEMS</text>
    <text x="14" y="44" fill="#c9d1d9" class="sans" font-size="12" font-weight="600">Autonomous Apps</text>
    <text x="14" y="59" fill="#8b949e" class="mono" font-size="10.5">AlphaGuard • Avatar • OCR</text>
  </g>
</svg>
