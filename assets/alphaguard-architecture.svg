<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="330" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="header-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#39c5bb"/>
    </linearGradient>
    <linearGradient id="bull-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="risk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="326" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="846" height="4" rx="2" fill="url(#header-glow)"/>

  <!-- Section Header -->
  <text x="30" y="28" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ALPHAGUARD AI • MULTI-AGENT INVESTMENT COMMITTEE ARCHITECTURE</text>
  <text x="730" y="28" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">8 AGENTS • MCP</text>

  <!-- Layer 1: Market Ingestion -->
  <g transform="translate(30, 48)">
    <rect width="790" height="42" rx="6" fill="url(#card-bg)" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="21" r="5" fill="#58a6ff"/>
    <text x="35" y="25" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Alpaca Market Data Feed</text>
    <text x="210" y="25" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Real-time options chains, implied volatility, macro news, historical candles</text>
    <rect x="710" y="11" width="65" height="20" rx="4" fill="#1f6feb" fill-opacity="0.3"/>
    <text x="722" y="25" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">STREAM</text>
  </g>

  <!-- Connecting Lines 1 to 2 -->
  <line x1="425" y1="90" x2="425" y2="108" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="425,112 422,106 428,106" fill="#58a6ff"/>

  <!-- Layer 2: Research & Adversarial Debate -->
  <!-- Bull Agent -->
  <g transform="translate(30, 114)">
    <rect width="250" height="92" rx="8" fill="url(#bull-grad)" stroke="#238636" stroke-width="1.2"/>
    <circle cx="18" cy="20" r="5" fill="#3fb950"/>
    <text x="32" y="24" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">BULL AGENT</text>
    <text x="18" y="44" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Upside Catalyst Analysis</text>
    <text x="18" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Momentum, earnings drift,</text>
    <text x="18" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">call skew, bullish breakouts</text>
  </g>

  <!-- Lead Analyst / Synthesizer (Center) -->
  <g transform="translate(300, 114)">
    <rect width="250" height="92" rx="8" fill="url(#card-bg)" stroke="#bc8cff" stroke-width="1.2"/>
    <circle cx="18" cy="20" r="5" fill="#bc8cff"/>
    <text x="32" y="24" fill="#bc8cff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">CHIEF INVESTMENT AGENT</text>
    <text x="18" y="44" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Adversarial Debate Synthesis</text>
    <text x="18" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Aggregates Bull vs Bear cases,</text>
    <text x="18" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">generates proposed contract &amp; strike</text>
  </g>

  <!-- Bear Agent -->
  <g transform="translate(570, 114)">
    <rect width="250" height="92" rx="8" fill="url(#bear-grad)" stroke="#da3633" stroke-width="1.2"/>
    <circle cx="18" cy="20" r="5" fill="#f85149"/>
    <text x="32" y="24" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">BEAR AGENT</text>
    <text x="18" y="44" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Downside Vulnerability Analysis</text>
    <text x="18" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Macro headwinds, IV crush risk,</text>
    <text x="18" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">tail-risk exposure, hedge thesis</text>
  </g>

  <!-- Debate Arrows -->
  <path d="M 280 160 L 300 160" stroke="#3fb950" stroke-width="1.5"/>
  <path d="M 570 160 L 550 160" stroke="#f85149" stroke-width="1.5"/>

  <!-- Connecting to Risk Engine -->
  <line x1="425" y1="206" x2="425" y2="224" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="425,228 422,222 428,222" fill="#bc8cff"/>

  <!-- Layer 3: Deterministic Python Risk Engine (Zero-LLM Authority) -->
  <g transform="translate(30, 230)">
    <rect width="490" height="74" rx="8" fill="url(#risk-grad)" stroke="#d29922" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="5" fill="#d29922"/>
    <text x="35" y="26" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">DETERMINISTIC PYTHON RISK ENGINE (ZERO-LLM AUTHORITY)</text>
    <text x="20" y="46" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Hardcoded Mathematical Guardrails</text>
    <text x="20" y="62" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Max 2% risk/trade • Portfolio Greeks caps • Mandatory stop-loss • Strict sizing</text>
  </g>

  <!-- Arrow from Risk to Execution -->
  <line x1="520" y1="267" x2="550" y2="267" stroke="#39c5bb" stroke-width="2"/>
  <polygon points="550,267 544,263 544,271" fill="#39c5bb"/>

  <!-- Layer 4: Alpaca Execution & Post-Mortem -->
  <g transform="translate(560, 230)">
    <rect width="260" height="74" rx="8" fill="url(#card-bg)" stroke="#39c5bb" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="5" fill="#39c5bb"/>
    <text x="32" y="26" fill="#39c5bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">ALPACA OPTIONS EXECUTION</text>
    <text x="18" y="46" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Order Routing &amp; Post-Mortem</text>
    <text x="18" y="62" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Automated AI learning from P&amp;L</text>
  </g>
</svg>
