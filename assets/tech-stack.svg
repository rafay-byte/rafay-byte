<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 145" width="100%" height="145" fill="none">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131a"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="tech-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#39c5bb"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="141" rx="12" fill="url(#tech-bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="3" rx="1.5" fill="url(#tech-accent)"/>

  <!-- Top Header Label -->
  <text x="32" y="26" fill="#8b949e" class="mono" font-size="11" font-weight="700" letter-spacing="1">// TECHNOLOGY STACK // CORE FRAMEWORKS &amp; TOOLS</text>

  <!-- Column 1: Core AI & Deep Learning -->
  <g transform="translate(32, 40)">
    <rect width="256" height="85" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="256" height="2.5" rx="1" fill="#58a6ff"/>
    <text x="16" y="22" fill="#58a6ff" class="mono" font-size="11" font-weight="700">CORE AI &amp; DEEP LEARNING</text>
    <text x="16" y="46" fill="#ffffff" class="mono" font-size="12.5" font-weight="600">Python &bull; PyTorch</text>
    <text x="16" y="68" fill="#c9d1d9" class="mono" font-size="12.5">Transformers &bull; CUDA</text>
  </g>

  <!-- Column 2: Computer Vision & GenAI -->
  <g transform="translate(312, 40)">
    <rect width="256" height="85" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="256" height="2.5" rx="1" fill="#39c5bb"/>
    <text x="16" y="22" fill="#39c5bb" class="mono" font-size="11" font-weight="700">VISION &amp; GENERATIVE AI</text>
    <text x="16" y="46" fill="#ffffff" class="mono" font-size="12.5" font-weight="600">OpenCV &bull; YOLOv8</text>
    <text x="16" y="68" fill="#c9d1d9" class="mono" font-size="12.5">Diffusers &bull; ControlNet</text>
  </g>

  <!-- Column 3: Systems & Production -->
  <g transform="translate(592, 40)">
    <rect width="256" height="85" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="256" height="2.5" rx="1" fill="#bc8cff"/>
    <text x="16" y="22" fill="#bc8cff" class="mono" font-size="11" font-weight="700">SYSTEMS &amp; PRODUCTION</text>
    <text x="16" y="46" fill="#ffffff" class="mono" font-size="12.5" font-weight="600">FastAPI &bull; Docker</text>
    <text x="16" y="68" fill="#c9d1d9" class="mono" font-size="12.5">PostgreSQL &bull; Git</text>
  </g>
</svg>
