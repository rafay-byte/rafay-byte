      <text x="10" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ FastAPI / Flask</text>

      <rect x="115" width="115" height="26" rx="4" fill="#1b7c83" fill-opacity="0.18" stroke="#39c5bb" stroke-width="0.8"/>
      <text x="125" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🖥️ PyQt5 Desktop</text>

      <rect y="36" width="105" height="26" rx="4" fill="#1b7c83" fill-opacity="0.18" stroke="#39c5bb" stroke-width="0.8"/>
      <text x="10" y="53" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎈 Streamlit / Gradio</text>

      <rect x="115" y="36" width="115" height="26" rx="4" fill="#1b7c83" fill-opacity="0.18" stroke="#39c5bb" stroke-width="0.8"/>
      <text x="125" y="53" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🐳 Docker / Cog</text>

      <rect y="68" width="105" height="26" rx="4" fill="#1b7c83" fill-opacity="0.18" stroke="#39c5bb" stroke-width="0.8"/>
      <text x="10" y="85" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🐧 Linux / Bash</text>

      <rect x="115" y="68" width="115" height="26" rx="4" fill="#1b7c83" fill-opacity="0.18" stroke="#39c5bb" stroke-width="0.8"/>
      <text x="125" y="85" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📈 Alpaca API</text>
