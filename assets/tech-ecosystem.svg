    <g transform="translate(18, 44)">
      <rect width="105" height="26" rx="4" fill="#8957e5" fill-opacity="0.18" stroke="#a371f7" stroke-width="0.8"/>
      <text x="10" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🤗 Transformers</text>

      <rect x="115" width="115" height="26" rx="4" fill="#8957e5" fill-opacity="0.18" stroke="#a371f7" stroke-width="0.8"/>
      <text x="125" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎨 Stable Diffusion</text>

      <rect y="36" width="105" height="26" rx="4" fill="#8957e5" fill-opacity="0.18" stroke="#a371f7" stroke-width="0.8"/>
      <text x="10" y="53" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎯 LoRA / QLoRA</text>

      <rect x="115" y="36" width="115" height="26" rx="4" fill="#8957e5" fill-opacity="0.18" stroke="#a371f7" stroke-width="0.8"/>
      <text x="125" y="53" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🕹️ ControlNet</text>

      <rect y="68" width="105" height="26" rx="4" fill="#8957e5" fill-opacity="0.18" stroke="#a371f7" stroke-width="0.8"/>
      <text x="10" y="85" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✨ GFPGAN</text>

      <rect x="115" y="68" width="115" height="26" rx="4" fill="#8957e5" fill-opacity="0.18" stroke="#a371f7" stroke-width="0.8"/>
      <text x="125" y="85" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🤖 Multi-Agent / MCP</text>
    </g>
  </g>

  <!-- Cluster 3: Systems & Engineering -->
  <g transform="translate(580, 0)">
    <rect width="270" height="145" rx="8" fill="url(#tech-card)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="0" y="0" width="270" height="3" rx="1.5" fill="#39c5bb"/>
    <text x="20" y="26" fill="#39c5bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SYSTEMS &amp; PRODUCTION</text>
    
