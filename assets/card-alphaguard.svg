<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 185" width="100%" height="185" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121720"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="card-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .status-dot { animation: pulse-dot 2s infinite ease-in-out; }
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="426" height="181" rx="10" fill="url(#card-bg)" stroke="#30363d" stroke-width="1.2"/>
  <rect x="2" y="2" width="426" height="3" rx="1.5" fill="url(#card-accent)"/>

  <!-- Top Metadata -->
  <circle cx="24" cy="25" r="4" fill="#3fb950" class="status-dot"/>
  <text x="36" y="29" fill="#58a6ff" class="mono" font-size="11.5" font-weight="700">01 // MULTI-AGENT</text>
  <text x="406" y="29" fill="#8b949e" class="mono" font-size="10.5" font-weight="600" text-anchor="end">ONLINE</text>

  <!-- Project Name -->
  <text x="24" y="66" fill="#ffffff" class="sans" font-size="21" font-weight="800" letter-spacing="0.5">ALPHAGUARD</text>

  <!-- One-Line Description -->
  <text x="24" y="96" fill="#8b949e" class="sans" font-size="13">Autonomous 8-agent AI investment committee &amp; risk engine</text>

  <!-- Tech Tags -->
  <g transform="translate(24, 114)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="30" y="15" fill="#c9d1d9" class="mono" font-size="11" text-anchor="middle">Python</text>

    <rect x="68" y="0" width="52" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="94" y="15" fill="#c9d1d9" class="mono" font-size="11" text-anchor="middle">LLMs</text>

    <rect x="128" y="0" width="62" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="159" y="15" fill="#c9d1d9" class="mono" font-size="11" text-anchor="middle">Agents</text>

    <rect x="198" y="0" width="86" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="241" y="15" fill="#c9d1d9" class="mono" font-size="11" text-anchor="middle">Alpaca API</text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="148" x2="406" y2="148" stroke="#21262d" stroke-width="1"/>

  <!-- Footer Link -->
  <text x="24" y="168" fill="#58a6ff" class="mono" font-size="11.5" font-weight="700">VIEW REPOSITORY →</text>
  <text x="406" y="168" fill="#6e7681" class="mono" font-size="10.5" text-anchor="end">rafay-byte/alphaguard</text>
</svg>
