<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170" fill="none">
  <defs>
    <linearGradient id="metric-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="stat-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#39c5bb"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="846" height="166" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <rect x="2" y="2" width="846" height="3" rx="1.5" fill="url(#stat-glow)"/>

  <!-- Stat Block 1: Repositories -->
  <g transform="translate(25, 22)">
    <rect width="180" height="126" rx="8" fill="url(#metric-bg)" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="28" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PUBLIC REPOSITORIES</text>
    <text x="18" y="74" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">29</text>
    <text x="18" y="98" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Open Source Codebases</text>
    <text x="18" y="114" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Active GitHub Portfolio</text>
  </g>

  <!-- Stat Block 2: AI / ML Systems -->
  <g transform="translate(220, 22)">
    <rect width="180" height="126" rx="8" fill="url(#metric-bg)" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="28" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SPECIALIZED AI SYSTEMS</text>
    <text x="18" y="74" fill="#bc8cff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">6+</text>
    <text x="18" y="98" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Flagship Deployments</text>
    <text x="18" y="114" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">LLMs, Vision &amp; Agents</text>
  </g>

  <!-- Stat Block 3: Primary Domains Distribution -->
  <g transform="translate(415, 22)">
    <rect width="410" height="126" rx="8" fill="url(#metric-bg)" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="26" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">RESEARCH &amp; CODEBASE DISTRIBUTION</text>

    <!-- Bar 1: Multi-Agent & LLMs -->
    <g transform="translate(20, 42)">
      <text x="0" y="11" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Multi-Agent AI &amp; LLM Reasoning</text>
      <text x="330" y="11" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">AlphaGuard • Fenrir</text>
      <rect y="16" width="370" height="6" rx="3" fill="#21262d"/>
      <rect y="16" width="340" height="6" rx="3" fill="#58a6ff"/>
    </g>

    <!-- Bar 2: Computer Vision & OCR -->
    <g transform="translate(20, 72)">
      <text x="0" y="11" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Computer Vision, OCR &amp; Robotics</text>
      <text x="316" y="11" fill="#39c5bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">URDU-OCR • Sugarcane</text>
      <rect y="16" width="370" height="6" rx="3" fill="#21262d"/>
      <rect y="16" width="310" height="6" rx="3" fill="#39c5bb"/>
    </g>

    <!-- Bar 3: Generative AI & Multimodal -->
    <g transform="translate(20, 102)">
      <text x="0" y="11" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Generative Diffusion &amp; Talking Head</text>
      <text x="312" y="11" fill="#bc8cff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Frame2Ghibli • SadTalker</text>
      <rect y="16" width="370" height="6" rx="3" fill="#21262d"/>
      <rect y="16" width="290" height="6" rx="3" fill="#bc8cff"/>
    </g>
  </g>
</svg>
