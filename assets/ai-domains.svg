<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180" fill="none">
  <defs>
    <linearGradient id="dom-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Card 1: LLMs & Multi-Agent AI -->
  <g transform="translate(0, 0)">
    <rect width="205" height="180" rx="8" fill="url(#dom-bg)" stroke="#1f6feb" stroke-width="1.2"/>
    <rect x="0" y="0" width="205" height="3" rx="1.5" fill="#58a6ff"/>
    <circle cx="20" cy="24" r="5" fill="#58a6ff"/>
    <text x="32" y="28" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">LLMs &amp; AGENTS</text>
    <text x="16" y="52" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Autonomous Reasoning</text>
    <text x="16" y="72" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Multi-Agent Debates</text>
    <text x="16" y="88" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• LoRA &amp; QLoRA Fine-Tuning</text>
    <text x="16" y="104" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Prompt Engineering</text>
    <text x="16" y="120" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Structured Eval Suites</text>
    <rect x="16" y="142" width="173" height="22" rx="4" fill="#1f6feb" fill-opacity="0.15"/>
    <text x="24" y="157" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Transformers • PEFT • MCP</text>
  </g>

  <!-- Card 2: Computer Vision -->
  <g transform="translate(215, 0)">
    <rect width="205" height="180" rx="8" fill="url(#dom-bg)" stroke="#1b7c83" stroke-width="1.2"/>
    <rect x="0" y="0" width="205" height="3" rx="1.5" fill="#39c5bb"/>
    <circle cx="20" cy="24" r="5" fill="#39c5bb"/>
    <text x="32" y="28" fill="#39c5bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">COMPUTER VISION</text>
    <text x="16" y="52" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Perception &amp; OCR</text>
    <text x="16" y="72" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• YOLOv8 Object Detection</text>
    <text x="16" y="88" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Right-to-Left Urdu OCR</text>
    <text x="16" y="104" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Morphological Pipelines</text>
    <text x="16" y="120" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Industrial Machine Vision</text>
    <rect x="16" y="142" width="173" height="22" rx="4" fill="#39c5bb" fill-opacity="0.15"/>
    <text x="24" y="157" fill="#39c5bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">YOLOv8 • OpenCV • PyTorch</text>
  </g>

  <!-- Card 3: Generative AI -->
  <g transform="translate(430, 0)">
    <rect width="205" height="180" rx="8" fill="url(#dom-bg)" stroke="#8957e5" stroke-width="1.2"/>
    <rect x="0" y="0" width="205" height="3" rx="1.5" fill="#bc8cff"/>
    <circle cx="20" cy="24" r="5" fill="#bc8cff"/>
    <text x="32" y="28" fill="#bc8cff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">GENERATIVE AI</text>
    <text x="16" y="52" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Diffusion &amp; Synthesis</text>
    <text x="16" y="72" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Stable Diffusion Pipelines</text>
    <text x="16" y="88" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• ControlNet Conditioning</text>
    <text x="16" y="104" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Audio Talking Avatars</text>
    <text x="16" y="120" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• GFPGAN Face Restoration</text>
    <rect x="16" y="142" width="173" height="22" rx="4" fill="#bc8cff" fill-opacity="0.15"/>
    <text x="24" y="157" fill="#bc8cff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Diffusers • SadTalker • GFPGAN</text>
  </g>

  <!-- Card 4: Systems & Engineering -->
  <g transform="translate(645, 0)">
    <rect width="205" height="180" rx="8" fill="url(#dom-bg)" stroke="#238636" stroke-width="1.2"/>
    <rect x="0" y="0" width="205" height="3" rx="1.5" fill="#3fb950"/>
    <circle cx="20" cy="24" r="5" fill="#3fb950"/>
    <text x="32" y="28" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">AI SYSTEMS &amp; OPS</text>
    <text x="16" y="52" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Production Engineering</text>
    <text x="16" y="72" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• CUDA GPU Acceleration</text>
    <text x="16" y="88" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Desktop UIs (PyQt5)</text>
    <text x="16" y="104" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Web Apps (Streamlit/Flask)</text>
    <text x="16" y="120" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Containerization (Cog)</text>
    <rect x="16" y="142" width="173" height="22" rx="4" fill="#238636" fill-opacity="0.15"/>
    <text x="24" y="157" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">CUDA • PyQt5 • Flask • Cog</text>
  </g>
</svg>
