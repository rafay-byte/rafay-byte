<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 145" width="100%" height="145" fill="none">
  <defs>
    <linearGradient id="stats-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131a"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="stats-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39c5bb"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="141" rx="12" fill="url(#stats-bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="3" rx="1.5" fill="url(#stats-accent)"/>

  <!-- Left: Repository & System Metrics -->
  <g transform="translate(36, 0)">
    <text x="0" y="26" fill="#8b949e" class="mono" font-size="11" font-weight="700" letter-spacing="1">// GITHUB METRICS</text>

    <!-- Metric 1 -->
    <g transform="translate(0, 38)">
      <rect width="370" height="42" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <text x="18" y="29" fill="#58a6ff" class="sans" font-size="22" font-weight="800">29</text>
      <text x="64" y="20" fill="#ffffff" class="sans" font-size="12.5" font-weight="700">Open-Source Repositories</text>
      <text x="64" y="34" fill="#8b949e" class="mono" font-size="10.5">Public GitHub projects &amp; tools</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(0, 88)">
      <rect width="370" height="42" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <text x="18" y="29" fill="#3fb950" class="sans" font-size="22" font-weight="800">08</text>
      <text x="64" y="20" fill="#ffffff" class="sans" font-size="12.5" font-weight="700">Flagship AI Systems</text>
      <text x="64" y="34" fill="#8b949e" class="mono" font-size="10.5">Active production architectures</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="440" y1="20" x2="440" y2="135" stroke="#21262d" stroke-width="1.2"/>

  <!-- Right: Domain Focus Areas -->
  <g transform="translate(470, 0)">
    <text x="0" y="26" fill="#8b949e" class="mono" font-size="11" font-weight="700" letter-spacing="1">// CORE SPECIALIZATIONS</text>

    <g transform="translate(0, 38)">
      <!-- Item 1 -->
      <circle cx="6" cy="12" r="3.5" fill="#58a6ff"/>
      <text x="18" y="16" fill="#c9d1d9" class="mono" font-size="11.5">Multi-Agent Systems &amp; Autonomous Frameworks</text>

      <!-- Item 2 -->
      <circle cx="6" cy="38" r="3.5" fill="#bc8cff"/>
      <text x="18" y="42" fill="#c9d1d9" class="mono" font-size="11.5">LLM Fine-Tuning (PEFT / LoRA) &amp; Evaluation</text>

      <!-- Item 3 -->
      <circle cx="6" cy="64" r="3.5" fill="#39c5bb"/>
      <text x="18" y="68" fill="#c9d1d9" class="mono" font-size="11.5">Computer Vision (YOLOv8) &amp; Deep Learning OCR</text>
    </g>
  </g>
</svg>
