<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 125" width="100%" height="125" fill="none">
  <defs>
    <linearGradient id="stats-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131a"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="stats-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39c5bb"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="121" rx="12" fill="url(#stats-bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="3" rx="1.5" fill="url(#stats-accent)"/>

  <!-- Left: Repository & System Metrics -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" fill="#8b949e" class="mono" font-size="11" font-weight="700" letter-spacing="1">// GITHUB METRICS</text>

    <!-- Metric 1 -->
    <g transform="translate(0, 18)">
      <text x="0" y="32" fill="#58a6ff" class="sans" font-size="32" font-weight="800">29</text>
      <text x="56" y="20" fill="#ffffff" class="sans" font-size="13" font-weight="700">Open-Source Repositories</text>
      <text x="56" y="36" fill="#8b949e" class="mono" font-size="11">Public GitHub projects &amp; tools</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(230, 18)">
      <text x="0" y="32" fill="#3fb950" class="sans" font-size="32" font-weight="800">08</text>
      <text x="52" y="20" fill="#ffffff" class="sans" font-size="13" font-weight="700">Flagship AI Systems</text>
      <text x="52" y="36" fill="#8b949e" class="mono" font-size="11">Active production architectures</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="490" y1="28" x2="490" y2="105" stroke="#21262d" stroke-width="1"/>

  <!-- Right: Domain Focus Areas -->
  <g transform="translate(518, 28)">
    <text x="0" y="0" fill="#8b949e" class="mono" font-size="11" font-weight="700" letter-spacing="1">// CORE SPECIALIZATIONS</text>

    <g transform="translate(0, 20)">
      <circle cx="6" cy="6" r="3.5" fill="#58a6ff"/>
      <text x="18" y="10" fill="#c9d1d9" class="mono" font-size="11.5">Multi-Agent Systems &amp; Autonomous Frameworks</text>

      <circle cx="6" cy="28" r="3.5" fill="#bc8cff"/>
      <text x="18" y="32" fill="#c9d1d9" class="mono" font-size="11.5">LLM Fine-Tuning (PEFT / LoRA) &amp; Evaluation</text>

      <circle cx="6" cy="50" r="3.5" fill="#39c5bb"/>
      <text x="18" y="54" fill="#c9d1d9" class="mono" font-size="11.5">Computer Vision (YOLOv8) &amp; Deep Learning OCR</text>
    </g>
  </g>
</svg>
